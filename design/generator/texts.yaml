tender_scheme:
  steps:
    # kind: data — поток (steel), agent — агент (lime), code — проверка кодом, human — решение человека
    - {title: "Bidzaar", text: "отбор закупок серверов и систем хранения данных.", kind: data}
    - {title: "Документы", text: "загрузка файлов и извлечение текста.", kind: data}
    - {title: "Агент", text: "изучение закупки, отчетности заказчика в ФНС и поиск контакта.", kind: agent}
    - {title: "Проверка кодом", text: "механическая сверка цифр номера, имени и почты с прочитанными текстами; удаление значений, не прошедших сверку.", kind: code}
    - {title: "Telegram", text: "карточка с потребностью, сроками, контактом и вопросами для разговора.", kind: data}
    - {title: "Менеджер", text: "«В работу» или «Мимо», заметки и выгрузки Excel.", kind: human}
  note: Закупка без телефона остается в журнале и менеджеру не уходит. Сверка не подтверждает актуальность номера; добавочный не проверяется.

